<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sac Vision Optique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #ff3131;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            margin: 0;
            line-height: 1.6;
        }

        /* Header & Nav */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(0,0,0,0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-red);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--primary-red);
        }

        .lang-switch {
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition);
        }

        .lang-switch:hover {
            transform: scale(1.05);
            background: white;
            color: var(--primary-red);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 5%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1574258495973-f010dfbb5371?auto=format&fit=crop&q=80&w=2070') center/cover;
            border-bottom: 5px solid var(--primary-red);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--text-white);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-gray);
            margin-bottom: 30px;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .order-btn {
            display: inline-block;
            background: var(--primary-red);
            color: white;
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.3rem;
            transition: var(--transition);
            border: 3px solid var(--primary-red);
            box-shadow: 0 5px 20px rgba(255, 49, 49, 0.4);
        }

        .order-btn:hover {
            transform: scale(1.1);
            background: transparent;
            color: var(--primary-red);
            box-shadow: 0 8px 30px rgba(255, 49, 49, 0.6);
        }

        .order-btn i {
            margin-right: 10px;
        }

        /* Services Section */
        .services {
            padding: 80px 5%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .service-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #333;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .service-card:hover {
            border-color: var(--primary-red);
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(255, 49, 49, 0.2);
        }
